<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi Controller & Dashboard (HUD)</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161f30;
      --primary: #00f2fe;
      --accent: #4facfe;
      --danger: #ff4b4b;
      --warning: #ffb703;
      --success: #00e676;
      --text: #ffffff;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: var(--primary);
      text-transform: uppercase;
    }

    .badge-status {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* MOCHI DISPLAY SIMULATOR */
    .mochi-card {
      background: #000000;
      border: 3px solid #222;
      border-radius: 24px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      position: relative;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
      overflow: hidden;
    }

    .mochi-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      position: relative;
      width: 100%;
      height: 120px;
    }

    /* EYES & ANIMATIONS */
    .eye {
      width: 45px;
      height: 60px;
      background-color: var(--primary);
      border-radius: 12px;
      transition: all 0.2s ease;
      position: relative;
      box-shadow: 0 0 12px var(--primary);
    }

    /* Mochi Expressions Mechanics */
    .eye.look-left { transform: translateX(-15px); }
    .eye.look-right { transform: translateX(15px); }
    .eye.wink-left { transform: scaleY(0.1); }
    .eye.sleepy { transform: scaleY(0.3) translateY(10px); }
    
    /* Happy Level 1 */
    .eye.happy {
      height: 25px;
      border-radius: 25px 25px 0 0;
      background: transparent;
      border: 8px solid var(--primary);
      border-bottom: none;
      box-shadow: none;
    }

    /* Happy Level 2 - Heart Eyes */
    .eye.heart {
      background: transparent;
      box-shadow: none;
      width: 50px;
      height: 50px;
    }
    .eye.heart::before, .eye.heart::after {
      content: "";
      position: absolute;
      left: 25px;
      top: 0;
      width: 25px;
      height: 40px;
      background: #ff2a6d;
      border-radius: 25px 25px 0 0;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
      box-shadow: 0 0 10px #ff2a6d;
    }
    .eye.heart::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }

    /* Happy Level 3 - Sparkle & Wiggle */
    .eye.sparkle {
      background: #ff007f;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      box-shadow: 0 0 15px #ff007f;
      width: 50px;
      height: 50px;
    }

    .wiggle {
      animation: wiggleAnim 0.4s infinite alternate ease-in-out;
    }

    @keyframes wiggleAnim {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-8px) rotate(3deg); }
    }

    /* Overspeed Panic */
    .mochi-card.panic {
      border-color: var(--danger);
      animation: shake 0.15s infinite;
    }
    .eye.panic-eye {
      background-color: var(--danger);
      box-shadow: 0 0 15px var(--danger);
      width: 55px;
      height: 55px;
      border-radius: 50%;
    }

    @keyframes shake {
      0% { transform: translate(2px, 2px); }
      50% { transform: translate(-2px, -2px); }
      100% { transform: translate(2px, -2px); }
    }

    /* MOUTH */
    .mouth {
      position: absolute;
      bottom: 15px;
      width: 20px;
      height: 10px;
      border-bottom: 4px solid var(--primary);
      border-radius: 0 0 10px 10px;
      transition: all 0.2s ease;
    }

    .mouth.open { height: 20px; border-radius: 50%; border: 4px solid var(--primary); }
    .mouth.whistle { width: 12px; height: 12px; border: 3px solid var(--primary); border-radius: 50%; transform: translateX(10px); }
    .mouth.panic-mouth { width: 30px; height: 25px; border: 4px solid var(--danger); border-radius: 50%; background: rgba(255, 75, 75, 0.2); }

    /* MAPS OLED ARROWS */
    .nav-arrow {
      font-size: 3rem;
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary);
      display: none;
      animation: blinkArrow 0.8s infinite alternate;
    }

    @keyframes blinkArrow {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    /* CONTROLS & TABS */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
    }

    .tab-group {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.85rem;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
    }

    .panel { display: none; flex-direction: column; gap: 12px; }
    .panel.active { display: flex; }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
    .btn-danger { background: var(--danger); color: #fff; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    /* SPEEDOMETER HUD */
    .hud-display {
      text-align: center;
      padding: 15px;
    }

    .speed-value {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }

    .speed-unit { font-size: 0.9rem; color: var(--text-dim); margin-top: 5px; }

    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .slider-container label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    /* INFO FOOTER */
    .info-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-dim);
      padding: 0 5px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mochi Controller</h1>
    <div class="badge-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Terputus</span>
    </div>
  </header>

  <div class="container">

    <!-- MOCHI OLED SIMULATOR DISPLAY -->
    <div class="mochi-card" id="mochiCard">
      <div class="mochi-screen" id="mochiScreen">
        <div class="nav-arrow" id="arrowLeft">❮❮</div>
        <div class="eye" id="eyeLeft"></div>
        <div class="mouth" id="mochiMouth"></div>
        <div class="eye" id="eyeRight"></div>
        <div class="nav-arrow" id="arrowRight">❯❯</div>
      </div>
    </div>

    <!-- MAIN NAVIGATION TABS -->
    <div class="card">
      <div class="tab-group">
        <button class="tab-btn active" onclick="switchMode('NORMAL')">Normal</button>
        <button class="tab-btn" onclick="switchMode('HAPPY')">Senang</button>
        <button class="tab-btn" onclick="switchMode('RIDING')">Riding</button>
        <button class="tab-btn" onclick="switchMode('MAPS')">Maps Mode</button>
      </div>

      <!-- PANEL 1: NORMAL MODE (GABUT 4 DETIK) -->
      <div class="panel active" id="panelNORMAL">
        <p style="font-size: 0.85rem; color: var(--text-dim);">Mode gabut otomatis berganti ekspresi tiap 4 detik (kedip, melirik, menguap, siul, wink).</p>
        <div class="info-bar">
          <span>Status Idle: <b id="idleStateText" style="color:var(--primary)">Aktif</b></span>
          <span>Timer: <b>4s</b></span>
        </div>
      </div>

      <!-- PANEL 2: HAPPY MODE (3 LEVEL TOUCH & HOLD) -->
      <div class="panel" id="panelHAPPY">
        <p style="font-size: 0.85rem; color: var(--text-dim);">Simulasi sentuhan/hold pada bodi Mochi:</p>
        <div class="grid-3">
          <button class="btn btn-outline" onclick="triggerHappy(1)">Level 1<br><small>(Tap)</small></button>
          <button class="btn btn-outline" onclick="triggerHappy(2)">Level 2<br><small>(Hold 2s)</small></button>
          <button class="btn btn-outline" onclick="triggerHappy(3)">Level 3<br><small>(Hold 5s)</small></button>
        </div>
      </div>

      <!-- PANEL 3: RIDING MODE (HUD & SPEED) -->
      <div class="panel" id="panelRIDING">
        <div class="hud-display">
          <div class="speed-value" id="speedDisplay">0</div>
          <div class="speed-unit">KM/JAM</div>
        </div>

        <div class="slider-container">
          <label>
            <span>Simulasi Kecepatan</span>
            <b id="simSpeedVal">0 km/jam</b>
          </label>
          <input type="range" id="simSpeedSlider" min="0" max="140" value="0" oninput="updateSimulatedSpeed(this.value)">
        </div>

        <div class="slider-container">
          <label>
            <span>Batas Kecepatan (Speed Limit)</span>
            <b id="limitVal">80 km/jam</b>
          </label>
          <input type="range" id="limitSlider" min="30" max="120" value="80" oninput="updateSpeedLimit(this.value)">
        </div>

        <button class="btn btn-outline" style="margin-top:5px;" onclick="toggleGPS()" id="btnGPS">Aktifkan GPS HP</button>
      </div>

      <!-- PANEL 4: MAPS MODE (NAVIGATION CONTROL) -->
      <div class="panel" id="panelMAPS">
        <p style="font-size: 0.85rem; color: var(--text-dim);">Petunjuk arah navigasi untuk layar Mochi:</p>
        <div class="grid-2">
          <button class="btn btn-outline" onclick="triggerMaps('LEFT')">❮ Belok Kiri</button>
          <button class="btn btn-outline" onclick="triggerMaps('RIGHT')">Belok Kanan ❯</button>
        </div>
        <div class="grid-2">
          <button class="btn btn-outline" onclick="triggerMaps('STRAIGHT')">▲ Lurus / Mencepat</button>
          <button class="btn btn-primary" onclick="triggerMaps('ARRIVED')">★ Sampai Tujuan</button>
        </div>
      </div>
    </div>

    <!-- BLUETOOTH CONTROL CARD -->
    <div class="card grid-2">
      <button class="btn btn-primary" onclick="connectBluetooth()">Hubungkan BLE</button>
      <button class="btn btn-danger" onclick="disconnectBluetooth()">Putuskan</button>
    </div>

    <!-- FOOTER INFO -->
    <div class="info-bar">
      <span>Jam: <b id="clockText">00:00</b></span>
      <span>Payload: <b id="payloadText">-</b></span>
    </div>

  </div>

  <script>
    // --- GLOBAL VARIABLES ---
    let currentMode = 'NORMAL';
    let bleDevice, bleServer, rxCharacteristic;
    let idleTimer = null;
    let currentSpeed = 0;
    let speedLimit = 80;
    let isGPSActive = false;
    let watchId = null;

    // UUID Bluetooth ESP32 (Atur Sesuai ESP32 Anda)
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    // --- DOM ELEMENTS ---
    const eyeLeft = document.getElementById('eyeLeft');
    const eyeRight = document.getElementById('eyeRight');
    const mochiMouth = document.getElementById('mochiMouth');
    const mochiCard = document.getElementById('mochiCard');
    const mochiScreen = document.getElementById('mochiScreen');
    const arrowLeft = document.getElementById('arrowLeft');
    const arrowRight = document.getElementById('arrowRight');

    // --- INITIALIZATION ---
    window.onload = () => {
      startClock();
      startIdleLoop();
    };

    // --- CLOCK ---
    function startClock() {
      setInterval(() => {
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0].substring(0, 5);
        document.getElementById('clockText').innerText = timeStr;
      }, 1000);
    }

    // --- MODE SWITCHING ---
    function switchMode(mode) {
      currentMode = mode;
      
      // Update Tabs UI
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(`panel${mode}`).classList.add('active');

      resetMochiVisual();

      if (mode === 'NORMAL') {
        startIdleLoop();
      } else {
        stopIdleLoop();
      }

      if (mode === 'RIDING') {
        evaluateRidingState();
      }

      sendBluetoothPayload();
    }

    function resetMochiVisual() {
      eyeLeft.className = 'eye';
      eyeRight.className = 'eye';
      mochiMouth.className = 'mouth';
      mochiCard.className = 'mochi-card';
      mochiScreen.className = 'mochi-screen';
      arrowLeft.style.display = 'none';
      arrowRight.style.display = 'none';
    }

    // --- 1. MODE NORMAL (GABUT 4 DETIK) ---
    function startIdleLoop() {
      stopIdleLoop();
      runRandomIdleAnimation();
      idleTimer = setInterval(runRandomIdleAnimation, 4000);
    }

    function stopIdleLoop() {
      if (idleTimer) clearInterval(idleTimer);
    }

    function runRandomIdleAnimation() {
      if (currentMode !== 'NORMAL') return;

      resetMochiVisual();
      const rand = Math.floor(Math.random() * 5);

      switch (rand) {
        case 0: // Melirik Kanan
          eyeLeft.classList.add('look-right');
          eyeRight.classList.add('look-right');
          document.getElementById('idleStateText').innerText = "Melirik Kanan";
          break;
        case 1: // Melirik Kiri
          eyeLeft.classList.add('look-left');
          eyeRight.classList.add('look-left');
          document.getElementById('idleStateText').innerText = "Melirik Kiri";
          break;
        case 2: // Mengantuk
          eyeLeft.classList.add('sleepy');
          eyeRight.classList.add('sleepy');
          mochiMouth.classList.add('open');
          document.getElementById('idleStateText').innerText = "Mengantuk/Menguap";
          break;
        case 3: // Siul
          mochiMouth.classList.add('whistle');
          document.getElementById('idleStateText').innerText = "Bersenandung/Siul";
          break;
        case 4: // Wink
          eyeLeft.classList.add('wink-left');
          document.getElementById('idleStateText').innerText = "Wink / Berkedip";
          break;
      }
      sendBluetoothPayload();
    }

    // --- 2. MODE SENANG (3 LEVEL TOUCH HOLD) ---
    function triggerHappy(level) {
      resetMochiVisual();

      if (level === 1) { // Tap Singkat
        eyeLeft.classList.add('happy');
        eyeRight.classList.add('happy');
      } else if (level === 2) { // Hold 2s - Heart Eyes
        eyeLeft.classList.add('heart');
        eyeRight.classList.add('heart');
        mochiMouth.classList.add('open');
      } else if (level === 3) { // Hold 5s - Sparkle & Wiggle
        eyeLeft.classList.add('sparkle');
        eyeRight.classList.add('sparkle');
        mochiMouth.classList.add('open');
        mochiScreen.classList.add('wiggle');
      }

      sendBluetoothPayload(`HAPPY_L${level}`);
    }

    // --- 3. RIDING MODE & SPEEDOMETER ---
    function updateSimulatedSpeed(val) {
      currentSpeed = parseInt(val);
      document.getElementById('simSpeedVal').innerText = `${currentSpeed} km/jam`;
      document.getElementById('speedDisplay').innerText = currentSpeed;
      if (currentMode === 'RIDING') evaluateRidingState();
    }

    function updateSpeedLimit(val) {
      speedLimit = parseInt(val);
      document.getElementById('limitVal').innerText = `${speedLimit} km/jam`;
      if (currentMode === 'RIDING') evaluateRidingState();
    }

    function evaluateRidingState() {
      resetMochiVisual();
      const ratio = currentSpeed / speedLimit;

      if (ratio > 1.0) { // Overspeed Panic (>100%)
        mochiCard.classList.add('panic');
        eyeLeft.classList.add('panic-eye');
        eyeRight.classList.add('panic-eye');
        mochiMouth.classList.add('panic-mouth');
        sendBluetoothPayload('RIDE_PANIC');
      } else if (ratio > 0.5) { // Happy Ride (51 - 95%)
        eyeLeft.classList.add('happy');
        eyeRight.classList.add('happy');
        mochiMouth.classList.add('open');
        sendBluetoothPayload('RIDE_HAPPY');
      } else { // Cruising Santai (0 - 50%)
        mochiMouth.classList.add('whistle');
        sendBluetoothPayload('RIDE_SANTAI');
      }
    }

    function toggleGPS() {
      if (!isGPSActive) {
        if ("geolocation" in navigator) {
          watchId = navigator.geolocation.watchPosition(
            (pos) => {
              const speedMs = pos.coords.speed || 0;
              currentSpeed = Math.round(speedMs * 3.6); // Convert m/s to km/h
              document.getElementById('speedDisplay').innerText = currentSpeed;
              document.getElementById('simSpeedSlider').value = currentSpeed;
              document.getElementById('simSpeedVal').innerText = `${currentSpeed} km/jam`;
              if (currentMode === 'RIDING') evaluateRidingState();
            },
            (err) => alert("Gagal mengambil lokasi GPS: " + err.message),
            { enableHighAccuracy: true }
          );
          isGPSActive = true;
          document.getElementById('btnGPS').innerText = "Matikan GPS HP";
          document.getElementById('btnGPS').classList.replace('btn-outline', 'btn-danger');
        }
      } else {
        navigator.geolocation.clearWatch(watchId);
        isGPSActive = false;
        document.getElementById('btnGPS').innerText = "Aktifkan GPS HP";
        document.getElementById('btnGPS').classList.replace('btn-danger', 'btn-outline');
      }
    }

    // --- 4. MAPS MODE (NAVIGATION CONTROL) ---
    function triggerMaps(direction) {
      resetMochiVisual();

      if (direction === 'LEFT') {
        arrowLeft.style.display = 'block';
        eyeLeft.classList.add('look-left');
        eyeRight.classList.add('look-left');
      } else if (direction === 'RIGHT') {
        arrowRight.style.display = 'block';
        eyeLeft.classList.add('look-right');
        eyeRight.classList.add('look-right');
      } else if (direction === 'STRAIGHT') {
        mochiMouth.classList.add('open');
      } else if (direction === 'ARRIVED') {
        triggerHappy(3); // Selebrasi
        return;
      }

      sendBluetoothPayload(`MAPS_${direction}`);
    }

    // --- BLUETOOTH BLE COMMUNICATION ---
    async function connectBluetooth() {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'Mochi' }],
          optionalServices: [SERVICE_UUID]
        });

        bleServer = await bleDevice.gatt.connect();
        const service = await bleServer.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('statusText').innerText = "Terhubung";
        sendBluetoothPayload();
      } catch (err) {
        alert("Koneksi Bluetooth Gagal: " + err);
      }
    }

    function disconnectBluetooth() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('statusText').innerText = "Terputus";
    }

    function sendBluetoothPayload(customDetail = "") {
      const timeStr = document.getElementById('clockText').innerText;
      let detail = customDetail || document.getElementById('idleStateText').innerText;
      
      // Payload Format: Kecepatan | Mode | Detail/Arah | Jam
      const payload = `${currentSpeed}|${currentMode}|${detail}|${timeStr}`;
      document.getElementById('payloadText').innerText = payload;

      if (rxCharacteristic && bleDevice.gatt.connected) {
        const encoder = new TextEncoder();
        rxCharacteristic.writeValue(encoder.encode(payload));
      }
    }
  </script>
</body>
</html>
