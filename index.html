<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi Controller & HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .card {
      background-color: #1e293b;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin-bottom: 16px;
      border: 1px solid #334155;
    }

    /* --- OLED MOCHI SCREEN --- */
    .mochi-screen-container {
      background-color: #000000;
      border: 4px solid #334155;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05);
      margin-bottom: 15px;
    }

    .mochi-face {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transition: all 0.2s ease;
    }

    .eyes-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 130px;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .eye {
      width: 28px;
      height: 40px;
      background-color: #ffffff;
      border-radius: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
    }

    /* --- VARIASI MATA --- */
    .eye.blink {
      height: 4px !important;
      margin-top: 18px;
    }

    .eye.sleepy {
      height: 14px !important;
      margin-top: 13px;
      border-radius: 4px 4px 10px 10px;
    }

    .eye.shocked {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #ef4444;
      box-shadow: 0 0 15px #ef4444;
      animation: pulseShock 0.3s infinite alternate;
    }

    .eye.happy {
      height: 16px;
      border-radius: 16px 16px 0 0;
      background-color: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }

    /* Melirik Kiri / Kanan */
    .look-left { transform: translateX(-18px); }
    .look-right { transform: translateX(18px); }

    /* --- VARIASI MULUT --- */
    .mouth {
      width: 20px;
      height: 6px;
      background-color: #ffffff;
      border-radius: 4px;
      transition: all 0.2s ease;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
    }

    .mouth.happy {
      width: 28px;
      height: 12px;
      background-color: transparent;
      border-bottom: 4px solid #38bdf8;
      border-radius: 0 0 14px 14px;
      box-shadow: none;
    }

    .mouth.yawn {
      width: 16px;
      height: 22px;
      border-radius: 10px;
      background-color: #ffffff;
    }

    .mouth.whistle {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #38bdf8;
      transform: translateX(6px);
    }

    .mouth.shocked {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: #ef4444;
      box-shadow: 0 0 12px #ef4444;
      animation: pulseShock 0.3s infinite alternate;
    }

    @keyframes pulseShock {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    /* --- BUTTONS & CONTROLS --- */
    .status-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .dot.connected {
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-connect {
      background-color: #22c55e;
      color: white;
    }

    .btn-disconnect {
      background-color: #dc2626;
      color: white;
      margin-top: 8px;
    }

    .btn-test {
      background-color: #334155;
      color: #cbd5e1;
      padding: 8px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      border: 1px solid #475569;
      cursor: pointer;
    }

    .btn-test:hover {
      background-color: #475569;
    }

    .test-group {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      justify-content: center;
    }

    /* --- DASHBOARD --- */
    .speed-display {
      font-size: 3.8rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1;
      text-align: center;
      margin: 10px 0 4px 0;
    }

    .speed-unit {
      text-align: center;
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info-box {
      background-color: #0f172a;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #1e293b;
    }

    .info-label {
      font-size: 0.7rem;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 1rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .input-group {
      margin-top: 12px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .input-group input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: white;
      font-size: 0.95rem;
    }

    .overspeed-alert {
      border-color: #ef4444 !important;
      animation: alertGlow 0.8s infinite alternate;
    }

    @keyframes alertGlow {
      0% { box-shadow: 0 0 5px rgba(239, 68, 68, 0.2); }
      100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mochi Controller</h1>
    <p class="subtitle">Virtual OLED & BLE HUD</p>
  </header>

  <!-- KARTU MOCHI OLED ANIMATED -->
  <div class="card">
    <div class="mochi-screen-container" id="screenBox">
      <div class="mochi-face">
        <div class="eyes-container" id="eyesContainer">
          <div class="eye" id="leftEye"></div>
          <div class="eye" id="rightEye"></div>
        </div>
        <div class="mouth" id="mochiMouth"></div>
      </div>
    </div>

    <!-- TESTER EKSPRESI -->
    <div class="test-group">
      <button class="btn-test" onclick="setMood('NORMAL')">Gabut</button>
      <button class="btn-test" onclick="setMood('HAPPY')">Happy</button>
      <button class="btn-test" onclick="setMood('OVERSPEED')">Kaget</button>
    </div>
  </div>

  <!-- KARTU KONEKSI BLE -->
  <div class="card">
    <div class="status-container">
      <span>Status BLE:</span>
      <div class="status-indicator">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">Terputus</span>
      </div>
    </div>

    <button id="connectBtn" class="btn btn-connect">Hubungkan ke Mochi</button>
    <button id="disconnectBtn" class="btn btn-disconnect hidden">Putuskan Koneksi</button>
  </div>

  <!-- KARTU DASHBOARD SPEEDOMETER -->
  <div class="card" id="dashboardCard">
    <div class="info-label" style="text-align:center;">Kecepatan Kendaraan</div>
    <div id="speedDisplay" class="speed-display">0</div>
    <div class="speed-unit">KM/JAM</div>

    <div class="info-grid">
      <div class="info-box">
        <div class="info-label">Jam Terhubung</div>
        <div id="clockDisplay" class="info-value">00:00</div>
      </div>
      <div class="info-box">
        <div class="info-label">Ekspresi Mochi</div>
        <div id="moodDisplay" class="info-value">NORMAL</div>
      </div>
    </div>

    <div class="input-group">
      <label for="speedLimitInput">Batas Kecepatan / Speed Limit (KM/H):</label>
      <input type="number" id="speedLimitInput" value="80" min="10" max="200">
    </div>
  </div>

  <script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice = null;
    let bleCharacteristic = null;
    let watchId = null;

    let currentSpeed = 0;
    let speedLimit = 80;
    let activeMood = "NORMAL";

    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const speedDisplay = document.getElementById('speedDisplay');
    const clockDisplay = document.getElementById('clockDisplay');
    const moodDisplay = document.getElementById('moodDisplay');
    const speedLimitInput = document.getElementById('speedLimitInput');
    const dashboardCard = document.getElementById('dashboardCard');

    const leftEye = document.getElementById('leftEye');
    const rightEye = document.getElementById('rightEye');
    const eyesContainer = document.getElementById('eyesContainer');
    const mochiMouth = document.getElementById('mochiMouth');
    const screenBox = document.getElementById('screenBox');

    // --- MANAJEMEN EKSPRESI ---
    function resetFace() {
      leftEye.className = "eye";
      rightEye.className = "eye";
      eyesContainer.className = "eyes-container";
      mochiMouth.className = "mouth";
      screenBox.classList.remove('overspeed-alert');
    }

    function setMood(mood) {
      activeMood = mood;
      moodDisplay.innerText = mood;
      resetFace();

      if (mood === "OVERSPEED") {
        leftEye.classList.add('shocked');
        rightEye.classList.add('shocked');
        mochiMouth.classList.add('shocked');
        screenBox.classList.add('overspeed-alert');
      } else if (mood === "HAPPY") {
        leftEye.classList.add('happy');
        rightEye.classList.add('happy');
        mochiMouth.classList.add('happy');
      }
    }

    // --- ANIMASI AGILE / ORANG GABUT (RANDOM BEHAVIOR) ---
    function triggerRandomIdleAction() {
      if (activeMood !== "NORMAL") return;

      resetFace();
      const actions = ["blink", "look_left", "look_right", "yawn", "whistle", "wink"];
      const randomAction = actions[Math.floor(Math.random() * actions.length)];

      if (randomAction === "blink") {
        leftEye.classList.add('blink');
        rightEye.classList.add('blink');
        setTimeout(resetFace, 200);

      } else if (randomAction === "look_left") {
        eyesContainer.classList.add('look-left');
        setTimeout(resetFace, 1500);

      } else if (randomAction === "look_right") {
        eyesContainer.classList.add('look-right');
        setTimeout(resetFace, 1500);

      } else if (randomAction === "yawn") {
        leftEye.classList.add('sleepy');
        rightEye.classList.add('sleepy');
        mochiMouth.classList.add('yawn');
        setTimeout(resetFace, 2000);

      } else if (randomAction === "whistle") {
        leftEye.classList.add('happy');
        rightEye.classList.add('happy');
        mochiMouth.classList.add('whistle');
        setTimeout(resetFace, 1800);

      } else if (randomAction === "wink") {
        leftEye.classList.add('blink');
        setTimeout(resetFace, 300);
      }
    }

    // Jalankan gerakan acak setiap 3.5 - 6 detik sekali
    setInterval(triggerRandomIdleAction, 4000);

    // --- BLE & GPS LOGIC ---
    speedLimitInput.addEventListener('change', (e) => {
      speedLimit = parseInt(e.target.value) || 80;
    });

    connectBtn.addEventListener('click', async () => {
      try {
        statusText.innerText = "Mencari Mochi...";
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'DASAI_MOCHI' }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        statusDot.classList.add('connected');
        statusText.innerText = "Terhubung";
        connectBtn.classList.add('hidden');
        disconnectBtn.classList.remove('hidden');

        setMood("HAPPY");
        setTimeout(() => setMood("NORMAL"), 2000);

        startGPSWatch();
        setInterval(sendDataToMochi, 1000);

      } catch (error) {
        console.error("Gagal terhubung:", error);
        statusText.innerText = "Gagal Terhubung";
      }
    });

    disconnectBtn.addEventListener('click', () => {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    });

    function onDisconnected() {
      statusDot.classList.remove('connected');
      statusText.innerText = "Terputus";
      connectBtn.classList.remove('hidden');
      disconnectBtn.classList.add('hidden');

      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
      }
      setMood("NORMAL");
    }

    function startGPSWatch() {
      if ("geolocation" in navigator) {
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            let speedMps = position.coords.speed;
            if (speedMps !== null && speedMps > 0) {
              currentSpeed = Math.round(speedMps * 3.6);
            } else {
              currentSpeed = 0;
            }
            updateUI();
          },
          (error) => {
            console.warn("GPS Error:", error.message);
          },
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
        );
      }
    }

    function sendDataToMochi() {
      if (!bleCharacteristic) return;

      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${hours}:${minutes}`;

      if (currentSpeed > speedLimit) {
        setMood("OVERSPEED");
      } else if (activeMood !== "HAPPY") {
        if (activeMood === "OVERSPEED") setMood("NORMAL");
      }

      const payload = `${currentSpeed}|${activeMood}|${timeStr}|${speedLimit}`;

      const encoder = new TextEncoder();
      bleCharacteristic.writeValue(encoder.encode(payload))
        .catch(err => console.error("Gagal kirim data:", err));

      clockDisplay.innerText = timeStr;
    }

    function updateUI() {
      speedDisplay.innerText = currentSpeed;
      if (currentSpeed > speedLimit) {
        dashboardCard.classList.add('overspeed-alert');
      } else {
        dashboardCard.classList.remove('overspeed-alert');
      }
    }
  </script>
</body>
</html>
