<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi Dash HUD Controller</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .card {
      background-color: #1e293b;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    .status-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #ef4444; /* Merah = Terputus */
      box-shadow: 0 0 8px #ef4444;
    }

    .dot.connected {
      background-color: #22c55e; /* Hijau = Terhubung */
      box-shadow: 0 0 8px #22c55e;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-connect {
      background-color: #0284c7;
      color: white;
    }

    .btn-connect:hover {
      background-color: #0369a1;
    }

    .btn-disconnect {
      background-color: #dc2626;
      color: white;
      margin-top: 10px;
    }

    .dashboard {
      text-align: center;
      margin-top: 10px;
    }

    .speed-display {
      font-size: 4rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1;
      margin: 15px 0 5px 0;
    }

    .speed-unit {
      font-size: 1rem;
      color: #64748b;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .info-box {
      background-color: #0f172a;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #1e293b;
    }

    .info-label {
      font-size: 0.75rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e2e8f0;
    }

    .input-group {
      margin-top: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #white;
      font-size: 1rem;
    }

    .overspeed-alert {
      background-color: #7f1d1d !important;
      border-color: #ef4444 !important;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mochi Controller</h1>
    <p class="subtitle">Bluetooth GPS Speedometer & HUD</p>
  </header>

  <!-- KARTU KONEKSI -->
  <div class="card">
    <div class="status-container">
      <span>Status Perangkat:</span>
      <div class="status-indicator">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">Terputus</span>
      </div>
    </div>

    <button id="connectBtn" class="btn btn-connect">Hubungkan ke Mochi</button>
    <button id="disconnectBtn" class="btn btn-disconnect hidden">Putuskan Koneksi</button>
  </div>

  <!-- KARTU DASHBOARD SPEEDOMETER -->
  <div class="card dashboard" id="dashboardCard">
    <div class="info-label">Kecepatan Kendaraan</div>
    <div id="speedDisplay" class="speed-display">0</div>
    <div class="speed-unit">KM/JAM</div>

    <div class="info-grid">
      <div class="info-box">
        <div class="info-label">Jam Terhubung</div>
        <div id="clockDisplay" class="info-value">00:00</div>
      </div>
      <div class="info-box">
        <div class="info-label">Ekspresi Mochi</div>
        <div id="moodDisplay" class="info-value">IDLE</div>
      </div>
    </div>

    <div class="input-group">
      <label for="speedLimitInput">Batas Kecepatan / Speed Limit (KM/H):</label>
      <input type="number" id="speedLimitInput" value="80" min="10" max="200">
    </div>
  </div>

  <script>
    // --- KONFIGURASI BLE ---
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice = null;
    let bleCharacteristic = null;
    let watchId = null;

    let currentSpeed = 0;
    let speedLimit = 80;

    // --- ELEMENT REFRESH ---
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const speedDisplay = document.getElementById('speedDisplay');
    const clockDisplay = document.getElementById('clockDisplay');
    const moodDisplay = document.getElementById('moodDisplay');
    const speedLimitInput = document.getElementById('speedLimitInput');
    const dashboardCard = document.getElementById('dashboardCard');

    // --- UPDATE EVENT HANDLERS ---
    speedLimitInput.addEventListener('change', (e) => {
      speedLimit = parseInt(e.target.value) || 80;
    });

    connectBtn.addEventListener('click', async () => {
      try {
        statusText.innerText = "Mencari Mochi...";
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'DASAI_MOCHI' }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        // Update UI Koneksi
        statusDot.classList.add('connected');
        statusText.innerText = "Terhubung";
        connectBtn.classList.add('hidden');
        disconnectBtn.classList.remove('hidden');

        // Jalankan GPS & Timer Pengiriman Data
        startGPSWatch();
        setInterval(sendDataToMochi, 1000);

      } catch (error) {
        console.error("Gagal terhubung:", error);
        statusText.innerText = "Gagal Terhubung";
      }
    });

    disconnectBtn.addEventListener('click', () => {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    });

    function onDisconnected() {
      statusDot.classList.remove('connected');
      statusText.innerText = "Terputus";
      connectBtn.classList.remove('hidden');
      disconnectBtn.classList.add('hidden');

      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
      }
    }

    // --- FUNGSI GPS & DATA ---
    function startGPSWatch() {
      if ("geolocation" in navigator) {
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            let speedMps = position.coords.speed;
            if (speedMps !== null && speedMps > 0) {
              currentSpeed = Math.round(speedMps * 3.6); // M/s ke KM/H
            } else {
              currentSpeed = 0;
            }
            updateUI();
          },
          (error) => {
            console.warn("GPS Error:", error.message);
          },
          {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 5000
          }
        );
      }
    }

    function sendDataToMochi() {
      if (!bleCharacteristic) return;

      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${hours}:${minutes}`;

      let mood = "IDLE";
      if (currentSpeed > speedLimit) {
        mood = "OVERSPEED";
      }

      // Format Paket Data: Kecepatan|Mood|Jam|SpeedLimit
      const payload = `${currentSpeed}|${mood}|${timeStr}|${speedLimit}`;

      const encoder = new TextEncoder();
      bleCharacteristic.writeValue(encoder.encode(payload))
        .catch(err => console.error("Gagal kirim data:", err));

      clockDisplay.innerText = timeStr;
      moodDisplay.innerText = mood;
    }

    function updateUI() {
      speedDisplay.innerText = currentSpeed;

      if (currentSpeed > speedLimit) {
        dashboardCard.classList.add('overspeed-alert');
      } else {
        dashboardCard.classList.remove('overspeed-alert');
      }
    }
  </script>
</body>
</html>
