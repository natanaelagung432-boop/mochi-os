<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi Controller & Dashboard (HUD)</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161f30;
      --primary: #00f2fe;
      --accent: #4facfe;
      --danger: #ff4b4b;
      --warning: #ffb703;
      --success: #00e676;
      --text: #ffffff;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: var(--primary);
      text-transform: uppercase;
    }

    .badge-status {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* MOCHI DISPLAY SIMULATOR */
    .mochi-card {
      background: #000000;
      border: 3px solid #222;
      border-radius: 24px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
      position: relative;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
      overflow: hidden;
    }

    .mochi-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      position: relative;
      width: 100%;
      height: 120px;
    }

    /* EYES & ANIMATIONS */
    .eye {
      width: 45px;
      height: 60px;
      background-color: var(--primary);
      border-radius: 12px;
      transition: all 0.2s ease;
      position: relative;
      box-shadow: 0 0 12px var(--primary);
    }

    .eye.look-left { transform: translateX(-15px); }
    .eye.look-right { transform: translateX(15px); }
    .eye.wink-left { transform: scaleY(0.1); }
    .eye.sleepy { transform: scaleY(0.3) translateY(10px); }
    
    .eye.happy {
      height: 25px;
      border-radius: 25px 25px 0 0;
      background: transparent;
      border: 8px solid var(--primary);
      border-bottom: none;
      box-shadow: none;
    }

    .eye.heart {
      background: transparent;
      box-shadow: none;
      width: 50px;
      height: 50px;
    }
    .eye.heart::before, .eye.heart::after {
      content: "";
      position: absolute;
      left: 25px;
      top: 0;
      width: 25px;
      height: 40px;
      background: #ff2a6d;
      border-radius: 25px 25px 0 0;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
      box-shadow: 0 0 10px #ff2a6d;
    }
    .eye.heart::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }

    .eye.sparkle {
      background: #ff007f;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      box-shadow: 0 0 15px #ff007f;
      width: 50px;
      height: 50px;
    }

    .wiggle {
      animation: wiggleAnim 0.4s infinite alternate ease-in-out;
    }

    @keyframes wiggleAnim {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-8px) rotate(3deg); }
    }

    .mochi-card.panic {
      border-color: var(--danger);
      animation: shake 0.15s infinite;
    }
    .eye.panic-eye {
      background-color: var(--danger);
      box-shadow: 0 0 15px var(--danger);
      width: 55px;
      height: 55px;
      border-radius: 50%;
    }

    @keyframes shake {
      0% { transform: translate(2px, 2px); }
      50% { transform: translate(-2px, -2px); }
      100% { transform: translate(2px, -2px); }
    }

    .mouth {
      position: absolute;
      bottom: 15px;
      width: 20px;
      height: 10px;
      border-bottom: 4px solid var(--primary);
      border-radius: 0 0 10px 10px;
      transition: all 0.2s ease;
    }

    .mouth.open { height: 20px; border-radius: 50%; border: 4px solid var(--primary); }
    .mouth.whistle { width: 12px; height: 12px; border: 3px solid var(--primary); border-radius: 50%; transform: translateX(10px); }
    .mouth.panic-mouth { width: 30px; height: 25px; border: 4px solid var(--danger); border-radius: 50%; background: rgba(255, 75, 75, 0.2); }

    .nav-arrow {
      font-size: 3rem;
      color: var(--primary);
      text-shadow: 0 0 10px var(--primary);
      display: none;
      animation: blinkArrow 0.8s infinite alternate;
    }

    @keyframes blinkArrow {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
    }

    .tab-group {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.85rem;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
    }

    .panel { display: none; flex-direction: column; gap: 12px; }
    .panel.active { display: flex; }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
    .btn-danger { background: var(--danger); color: #fff; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    .hud-display {
      text-align: center;
      padding: 15px;
    }

    .speed-value {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }

    .speed-unit { font-size: 0.9rem; color: var(--text-dim); margin-top: 5px; }

    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .slider-container label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-dim);
      padding: 0 5px;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mochi Controller</h1>
    <div class="badge-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Terputus</span>
    </div>
  </header>

  <div class="container">

    <!-- MOCHI OLED SIMULATOR DISPLAY -->
    <div class="mochi-card" id="mochiCard">
      <div class="mochi-screen" id="mochiScreen">
        <div class="nav-arrow" id="arrowLeft">❮❮</div>
        <div class="eye" id="eyeLeft"></div>
        <div class="mouth" id="mochiMouth"></div>
        <div class="eye" id="eyeRight"></div>
        <div class="nav-arrow" id="arrowRight">❯❯</div>
      </div>
    </div>

    <!-- MAIN NAVIGATION TABS -->
    <div class="card">
      <div class="tab-group">
        <button class="tab-btn active" onclick="switchMode('NORMAL', event)">Normal</button>
        <button class="tab-btn" onclick="switchMode('HAPPY', event)">Senang</button>
        <button class="tab-btn" onclick="switchMode('RIDING', event)">Riding</button>
        <button class="tab-btn" onclick="switchMode('MAPS', event)">Maps Mode</button>
      </div>

      <!-- PANEL 1: NORMAL MODE -->
      <div class="panel active" id="panelNORMAL">
        <p style="font-size: 0.85rem; color: var(--text-dim);">Mode gabut otomatis berganti ekspresi tiap 4 detik (kedip, melirik, menguap, siul, wink).</p>
        <div class="info-bar">
          <span>Status Idle: <b id="idleStateText" style="color:var(--primary)">Aktif</b></span>
          <span>Timer: <b>4s</b></span>
        </div>
      </div>

      <!-- PANEL 2: HAPPY MODE -->
      <div class="panel" id="panelHAPPY">
        <p style="font-size: 0.85rem; color: var(--text-dim);">Simulasi sentuhan/hold pada bodi Mochi:</p>
        <div class="grid-3">
          <button class="btn btn-outline" onclick="triggerHappy(1)">Level 1<br><small>(Tap)</small></button>
          <button class="btn btn-outline" onclick="triggerHappy(2)">Level 2<br><small>(Hold 2s)</small></button>
          <button class="btn btn-outline" onclick="triggerHappy(3)">Level 3<br><small>(Hold 5s)</small></button>
        </div>
      </div>

      <!-- PANEL 3: RIDING MODE -->
      <div class="panel" id="panelRIDING">
        <div class="hud-display">
          <div class="speed-value" id="speedDisplay">0</div>
          <div class="speed-unit">KM/JAM</div>
        </div>

        <div class="slider-container">
          <label>
            <span>Simulasi Kecepatan</span>
            <b id="simSpeedVal">0 km/jam</b>
          </label>
          <input type="range" id="simSpeedSlider" min="0" max="140" value="0" oninput="updateSimulatedSpeed(this.value)">
        </div>

        <div class="slider-container">
          <label>
            <span>Batas Kecepatan (Speed Limit)</span>
            <b id="limitVal">80 km/jam</b>
          </label>
          <input type="range" id="limitSlider" min="30" max="120" value="80" oninput="updateSpeedLimit(this.value)">
        </div>

        <button class="btn btn-outline" style="margin-top:5px;" onclick="toggleGPS()" id="btnGPS">Aktifkan GPS HP</button>
      </div>

      <!-- PANEL 4: MAPS MODE -->
      <div class="panel" id="panelMAPS">
        <p style="font-size: 0.85rem; color: var(--text-dim);">Petunjuk arah navigasi untuk layar Mochi:</p>
        <div class="grid-2">
          <button class="btn btn-outline" onclick="triggerMaps('LEFT')">❮ Belok Kiri</button>
          <button class="btn btn-outline" onclick="triggerMaps('RIGHT')">Belok Kanan ❯</button>
        </div>
        <div class="grid-2">
          <button class="btn btn-outline" onclick="triggerMaps('STRAIGHT')">▲ Lurus / Mencepat</button>
          <button class="btn btn-primary" onclick="triggerMaps('ARRIVED')">★ Sampai Tujuan</button>
        </div>
      </div>
    </div>

    <!-- BLUETOOTH CONTROL CARD -->
    <div class="card grid-2">
      <button class="btn btn-primary" onclick="connectBluetooth()">Hubungkan BLE</button>
      <button class="btn btn-danger" onclick="disconnectBluetooth()">Putuskan</button>
    </div>

    <!-- FOOTER INFO -->
    <div class="info-bar">
      <span>Jam: <b id="clockText">00:00</b></span>
      <span>Payload: <b id="payloadText" style="color:var(--primary)">-</b></span>
    </div>

  </div>

  <script>
    // --- GLOBAL VARIABLES ---
    let currentMode = 'NORMAL';
    let bleDevice = null;
    let bleServer = null;
    let rxCharacteristic = null;
    let idleTimer = null;
    let currentSpeed = 0;
    let speedLimit = 80;
    let isGPSActive = false;
    let watchId = null;

    // BLE UUID (Harus persis sama dengan kode C++ ESP32)
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    // --- DOM ELEMENTS ---
    const eyeLeft = document.getElementById('eyeLeft');
    const eyeRight = document.getElementById('eyeRight');
    const mochiMouth = document.getElementById('mochiMouth');
    const mochiCard = document.getElementById('mochiCard');
    const mochiScreen = document.getElementById('mochiScreen');
    const arrowLeft = document.getElementById('arrowLeft');
    const arrowRight = document.getElementById('arrowRight');

    // --- INITIALIZATION ---
    window.onload = () => {
      startClock();
      startIdleLoop();
    };

    // --- CLOCK ENGINE ---
    function startClock() {
      const updateClock = () => {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clockText').innerText = `${hrs}:${mins}`;
      };
      updateClock();
      setInterval(updateClock, 1000);
    }

    // --- BLE ENGINE ---
    async function connectBluetooth() {
      try {
        console.log("Mencari perangkat BLE...");
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'MOCHI_HUD' }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        bleServer = await bleDevice.gatt.connect();
        const service = await bleServer.getPrimaryService(SERVICE_UUID);
        rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        document.getElementById('statusDot').classList.add('connected');
        document.getElementById('statusText').innerText = 'Terhubung';
        
        sendBluetoothPayload();
      } catch (error) {
        console.error("Gagal koneksi BLE:", error);
        alert("Koneksi BLE Gagal: " + error);
      }
    }

    function disconnectBluetooth() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
    }

    function onDisconnected() {
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('statusText').innerText = 'Terputus';
      rxCharacteristic = null;
    }

    // --- PAYLOAD BUILDER & TRANSMITTER ---
    function sendBluetoothPayload(customDetail = "") {
      const payload = buildPayloadString(customDetail);
      document.getElementById('payloadText').innerText = payload;

      if (!rxCharacteristic) return;

      const encoder = new TextEncoder();
      rxCharacteristic.writeValue(encoder.encode(payload))
        .catch(err => console.error("Gagal Mengirim Payload:", err));
    }

    function buildPayloadString(customDetail = "") {
      const clock = document.getElementById('clockText').innerText || "08:45";
      const speed = currentSpeed.toString();
      let mode = currentMode;
      let detail = customDetail;

      if (!detail) {
        if (mode === 'NORMAL') detail = 'NORMAL';
        else if (mode === 'HAPPY') detail = 'HAPPY';
        else if (mode === 'RIDING') detail = 'CRUISING';
      }

      // Jika mode MAPS, susun CSV sesuai parseMapsData pada ESP32:
      // DIRECTION,DISTANCE,STREET,ETA,TOTALDIST,NEXTDIR,NEXTDIST
      if (mode === 'MAPS') {
        const navDir = customDetail || "STRAIGHT";
        detail = `${navDir},150m,Jl. Pemuda,10m,12.4km,STRAIGHT,500m`;
      }

      // Format akhir ESP32: SPEED|MODE|DETAIL|CLOCK
      return `${speed}|${mode}|${detail}|${clock}`;
    }

    // --- MODE SWITCHING ---
    function switchMode(mode, evt) {
      currentMode = mode;
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
      
      if (evt && evt.target) evt.target.classList.add('active');
      document.getElementById(`panel${mode}`).classList.add('active');

      resetMochiVisual();

      if (mode === 'NORMAL') startIdleLoop();
      else stopIdleLoop();

      if (mode === 'RIDING') evaluateRidingState();

      sendBluetoothPayload();
    }

    function resetMochiVisual() {
      eyeLeft.className = 'eye';
      eyeRight.className = 'eye';
      mochiMouth.className = 'mouth';
      mochiCard.className = 'mochi-card';
      mochiScreen.className = 'mochi-screen';
      arrowLeft.style.display = 'none';
      arrowRight.style.display = 'none';
    }

    // --- MODE NORMAL ---
    function startIdleLoop() {
      stopIdleLoop();
      runRandomIdleAnimation();
      idleTimer = setInterval(runRandomIdleAnimation, 4000);
    }

    function stopIdleLoop() {
      if (idleTimer) clearInterval(idleTimer);
    }

    function runRandomIdleAnimation() {
      if (currentMode !== 'NORMAL') return;

      resetMochiVisual();
      const rand = Math.floor(Math.random() * 5);

      switch (rand) {
        case 0:
          eyeLeft.classList.add('look-right');
          eyeRight.classList.add('look-right');
          document.getElementById('idleStateText').innerText = "Melirik Kanan";
          break;
        case 1:
          eyeLeft.classList.add('look-left');
          eyeRight.classList.add('look-left');
          document.getElementById('idleStateText').innerText = "Melirik Kiri";
          break;
        case 2:
          eyeLeft.classList.add('sleepy');
          eyeRight.classList.add('sleepy');
          mochiMouth.classList.add('open');
          document.getElementById('idleStateText').innerText = "Mengantuk/Menguap";
          break;
        case 3:
          mochiMouth.classList.add('whistle');
          document.getElementById('idleStateText').innerText = "Bersenandung/Siul";
          break;
        case 4:
          eyeLeft.classList.add('wink-left');
          document.getElementById('idleStateText').innerText = "Wink / Berkedip";
          break;
      }
      sendBluetoothPayload('NORMAL');
    }

    // --- MODE HAPPY ---
    function triggerHappy(level) {
      resetMochiVisual();

      if (level === 1) {
        eyeLeft.classList.add('happy');
        eyeRight.classList.add('happy');
      } else if (level === 2) {
        eyeLeft.classList.add('heart');
        eyeRight.classList.add('heart');
        mochiMouth.classList.add('open');
      } else if (level === 3) {
        eyeLeft.classList.add('sparkle');
        eyeRight.classList.add('sparkle');
        mochiMouth.classList.add('open');
        mochiScreen.classList.add('wiggle');
      }

      sendBluetoothPayload('HAPPY');
    }

    // --- MODE RIDING & SPEEDOMETER ---
    function updateSimulatedSpeed(val) {
      currentSpeed = parseInt(val);
      document.getElementById('simSpeedVal').innerText = `${currentSpeed} km/jam`;
      document.getElementById('speedDisplay').innerText = currentSpeed;
      if (currentMode === 'RIDING') evaluateRidingState();
    }

    function updateSpeedLimit(val) {
      speedLimit = parseInt(val);
      document.getElementById('limitVal').innerText = `${speedLimit} km/jam`;
      if (currentMode === 'RIDING') evaluateRidingState();
    }

    function evaluateRidingState() {
      resetMochiVisual();
      const ratio = currentSpeed / speedLimit;

      if (ratio > 1.0) { // Panic (Kecepatan > Speed Limit)
        mochiCard.classList.add('panic');
        eyeLeft.classList.add('panic-eye');
        eyeRight.classList.add('panic-eye');
        mochiMouth.classList.add('panic-mouth');
        sendBluetoothPayload('RIDE_PANIC');
      } else if (ratio > 0.5) {
        eyeLeft.classList.add('happy');
        eyeRight.classList.add('happy');
        m
